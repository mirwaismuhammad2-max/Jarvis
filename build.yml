<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<style>
:root{--bg:#060b14;--panel:#0d1522;--line:#1b2a3f;--ice:#9fe7ff;--amber:#ffb454;--mint:#b6ffcf;--ink:#dbe7f3;--mute:#6d7f93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Roboto,sans-serif}
body{--c:var(--ice);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.thinking{--c:var(--amber)}
body.speaking{--c:var(--mint)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
#status{color:var(--c);font-size:14px;transition:color .4s}
header button{background:none;border:0;color:var(--mute);font-size:15px;padding:8px 6px}
#orb{width:116px;height:116px;margin:6px auto 10px;border-radius:50%;border:2px solid var(--c);position:relative;box-shadow:0 0 34px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 28px color-mix(in srgb,var(--c) 20%,transparent);transition:border-color .4s,box-shadow .4s}
#orb::before{content:"";position:absolute;inset:13px;border-radius:50%;border:2px dashed var(--c);opacity:.55;animation:spin 16s linear infinite}
#orb::after{content:"";position:absolute;inset:36px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 38%,transparent 72%)}
body.listening #orb{animation:pulse 1s ease-in-out infinite}
body.thinking #orb::before{animation-duration:2s}
body.speaking #orb{animation:pulse 0.55s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#orb,#orb::before{animation:none!important}}
#log{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:14px 14px 4px 14px}
.m.assistant{align-self:flex-start;border-left:2px solid var(--ice);padding-left:12px}
.m.sys{align-self:center;color:var(--mute);font-size:14px;text-align:center}
#bar{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line)}
#inp{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;color:var(--ink);padding:0 16px;height:48px;font-size:16px;outline:none}
#inp:focus{border-color:var(--ice)}
.rb{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;padding:0}
#mic{background:var(--ice);border-color:var(--ice);color:#06202b}
body.listening #mic{background:var(--amber);border-color:var(--amber)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(92vw,440px);padding:18px;max-height:88vh}
dialog::backdrop{background:#000a}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:14px}
dialog input[type=text],dialog input[type=password],dialog select{width:100%;height:44px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--ink);font-size:16px}
.chk input{width:20px;height:20px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;min-width:90px}
.row .go{background:var(--ice);color:#06202b;border-color:var(--ice)}
.note{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.note button{background:none;border:0;color:var(--mute)}
</style>
</head>
<body class="idle">
<header>
  <span id="status">Ready</span>
  <span><button id="notesBtn">Notes</button><button id="setBtn">Settings</button></span>
</header>
<div id="orb"></div>
<div id="log"></div>
<div id="bar">
  <input id="inp" type="text" placeholder="Ask Jarvis" autocomplete="off" enterkeyhint="send">
  <button class="rb" id="send" aria-label="Send">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <button class="rb" id="mic" aria-label="Talk">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
</div>

<dialog id="dSet">
  <label>Anthropic API key</label>
  <input id="fKey" type="password" placeholder="sk-ant-..." autocomplete="off">
  <label>Your name (what Jarvis calls you)</label>
  <input id="fName" type="text">
  <label>Model</label>
  <select id="fModel">
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (balanced)</option>
    <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (fast, cheap)</option>
    <option value="claude-opus-5-5">Claude Opus 5.5 (strongest)</option>
  </select>
  <label>Voice language</label>
  <select id="fLang">
    <option value="en-US">English</option>
    <option value="it-IT">Italiano</option>
    <option value="ur-PK">اردو</option>
    <option value="hi-IN">हिन्दी</option>
    <option value="ar-SA">العربية</option>
  </select>
  <label class="chk"><input type="checkbox" id="fSpeak"> Speak replies aloud</label>
  <label class="chk"><input type="checkbox" id="fAuto"> Conversation mode (listen again after each reply)</label>
  <label class="chk"><input type="checkbox" id="fSearch"> Web search (must be enabled in your Anthropic console)</label>
  <div class="row">
    <button id="clearBtn">Clear chat</button>
    <button class="go" id="saveSet">Save</button>
  </div>
</dialog>

<dialog id="dNotes">
  <div id="noteList"></div>
  <div class="row"><button class="go" id="closeNotes">Close</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const cfg = Object.assign({ key:'', name:'', model:'claude-sonnet-5-5', lang:'en-US', speak:true, auto:false, search:false },
  JSON.parse(localStorage.getItem('jv_cfg') || '{}'));
let msgs = JSON.parse(localStorage.getItem('jv_msgs') || '[]');
let notes = JSON.parse(localStorage.getItem('jv_notes') || '[]');
const persist = () => {
  localStorage.setItem('jv_cfg', JSON.stringify(cfg));
  localStorage.setItem('jv_msgs', JSON.stringify(msgs));
  localStorage.setItem('jv_notes', JSON.stringify(notes));
};

const LABEL = { idle:'Ready', listening:'Listening', thinking:'Thinking', speaking:'Speaking' };
function setState(s){ document.body.className = s; $('#status').textContent = LABEL[s]; }
function bubble(role, text){
  const d = document.createElement('div');
  d.className = 'm ' + role; d.textContent = text;
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
}

/* ---------- Tools Jarvis can use on the phone ---------- */
const TOOLS = [
  { name:'save_note', description:'Save a note, task or reminder for the user.',
    input_schema:{ type:'object', properties:{ text:{ type:'string' } }, required:['text'] } },
  { name:'list_notes', description:'List the saved notes with their ids.',
    input_schema:{ type:'object', properties:{} } },
  { name:'delete_note', description:'Delete a saved note by id.',
    input_schema:{ type:'object', properties:{ id:{ type:'number' } }, required:['id'] } },
  { name:'set_timer', description:'Start a countdown timer. The phone speaks when it ends (app must stay open).',
    input_schema:{ type:'object', properties:{ seconds:{ type:'number' }, label:{ type:'string' } }, required:['seconds'] } },
  { name:'open_link', description:'Open something on the phone: https:// pages, tel:+39..., sms:, mailto:, geo:0,0?q=place, google.navigation:q=place, whatsapp://send?text=..., youtube.com search URLs.',
    input_schema:{ type:'object', properties:{ url:{ type:'string' } }, required:['url'] } }
];
function runTool(name, i){
  if (name === 'save_note'){ notes.push({ id:Date.now(), text:i.text }); persist(); return 'Saved.'; }
  if (name === 'list_notes') return notes.length ? notes.map(n => n.id + ': ' + n.text).join('\n') : 'No notes yet.';
  if (name === 'delete_note'){ notes = notes.filter(n => n.id !== i.id); persist(); return 'Deleted.'; }
  if (name === 'set_timer'){
    setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate([300,150,300]);
      const m = (i.label || 'Timer') + ' is done.'; bubble('assistant', m); speak(m);
    }, Math.max(1, i.seconds) * 1000);
    return 'Timer set for ' + i.seconds + ' seconds.';
  }
  if (name === 'open_link'){ setTimeout(() => { location.href = i.url; }, 2500); return 'Opening it now.'; }
  return 'Unknown tool.';
}

/* ---------- Claude ---------- */
const system = () =>
  'You are JARVIS, a personal AI assistant on the user\'s Android phone. Be concise, warm and slightly dry-witted. ' +
  'Replies are usually spoken aloud, so use short plain sentences with no markdown or lists unless asked. ' +
  'Reply in the language the user speaks. ' + (cfg.name ? 'Address the user as ' + cfg.name + '. ' : '') +
  'Use your tools to act: notes, timers, opening links, maps, calls and apps. Confirm actions in one short line. ' +
  'Current time: ' + new Date().toString() + '.';

async function callClaude(){
  const tools = TOOLS.slice();
  if (cfg.search) tools.push({ type:'web_search_20250305', name:'web_search', max_uses:3 });
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2023-06-01',
              'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:cfg.model, max_tokens:1024, system:system(), tools, messages:msgs })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j;
}

async function turn(text){
  if (!cfg.key){ $('#dSet').showModal(); return; }
  const start = msgs.length;
  msgs.push({ role:'user', content:text });
  bubble('user', text); setState('thinking');
  let spoken = '';
  try {
    for (let k = 0; k < 8; k++){
      const j = await callClaude();
      msgs.push({ role:'assistant', content:j.content });
      const t = j.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
      if (t){ bubble('assistant', t); spoken += t + ' '; }
      if (j.stop_reason === 'tool_use'){
        const results = j.content.filter(b => b.type === 'tool_use')
          .map(b => ({ type:'tool_result', tool_use_id:b.id, content:String(runTool(b.name, b.input)) }));
        msgs.push({ role:'user', content:results });
        continue;
      }
      if (j.stop_reason === 'pause_turn') continue;
      break;
    }
  } catch (e) {
    msgs.length = start;
    bubble('sys', 'Error: ' + e.message);
    setState('idle'); return;
  }
  while (msgs.length > 40) msgs.shift();
  while (msgs.length && !(msgs[0].role === 'user' && typeof msgs[0].content === 'string')) msgs.shift();
  persist();
  if (spoken.trim()){ setState('speaking'); await speak(spoken); }
  setState('idle');
  if (cfg.auto) listen();
}

/* ---------- Voice out ---------- */
function speak(t){
  return new Promise(res => {
    if (!cfg.speak || !window.speechSynthesis) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/[*_#`]/g, ''));
    u.lang = cfg.lang; u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}

/* ---------- Voice in ---------- */
const SR = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
let listening = false, heard = '', webRec = null;
function finishListen(){
  if (!listening) return;
  listening = false;
  const t = heard.trim(); $('#inp').value = '';
  if (t) turn(t); else setState('idle');
}
async function listen(){
  if (listening){ if (SR) SR.stop(); else if (webRec) webRec.stop(); else finishListen(); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  heard = '';
  if (SR){
    const p = await SR.requestPermissions();
    if (p.speechRecognition !== 'granted'){ bubble('sys', 'Allow microphone access for Jarvis in Android settings.'); return; }
    await SR.removeAllListeners();
    SR.addListener('partialResults', d => { heard = (d.matches && d.matches[0]) || heard; $('#inp').value = heard; });
    SR.addListener('listeningState', d => { if (d.status === 'stopped') finishListen(); });
    listening = true; setState('listening');
    SR.start({ language:cfg.lang, maxResults:1, partialResults:true, popup:false })
      .catch(e => { listening = false; setState('idle'); bubble('sys', 'Mic error: ' + (e.message || e)); });
  } else if (window.webkitSpeechRecognition){
    webRec = new webkitSpeechRecognition(); webRec.lang = cfg.lang; webRec.interimResults = true;
    webRec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(' '); $('#inp').value = heard; };
    webRec.onend = () => { webRec = null; finishListen(); };
    listening = true; setState('listening'); webRec.start();
  } else bubble('sys', 'Voice input is not available here. Type instead.');
}

/* ---------- UI wiring ---------- */
$('#mic').onclick = listen;
const sendTyped = () => { const t = $('#inp').value.trim(); if (!t) return; $('#inp').value = ''; turn(t); };
$('#send').onclick = sendTyped;
$('#inp').addEventListener('keydown', e => { if (e.key === 'Enter') sendTyped(); });

$('#setBtn').onclick = () => {
  $('#fKey').value = cfg.key; $('#fName').value = cfg.name; $('#fModel').value = cfg.model; $('#fLang').value = cfg.lang;
  $('#fSpeak').checked = cfg.speak; $('#fAuto').checked = cfg.auto; $('#fSearch').checked = cfg.search;
  $('#dSet').showModal();
};
$('#saveSet').onclick = () => {
  Object.assign(cfg, { key:$('#fKey').value.trim(), name:$('#fName').value.trim(), model:$('#fModel').value,
    lang:$('#fLang').value, speak:$('#fSpeak').checked, auto:$('#fAuto').checked, search:$('#fSearch').checked });
  persist(); $('#dSet').close();
};
$('#clearBtn').onclick = () => { msgs = []; persist(); $('#log').innerHTML = ''; $('#dSet').close(); };

function drawNotes(){
  $('#noteList').innerHTML = notes.length ? '' : '<p style="color:var(--mute)">No notes yet. Say "note that..." to Jarvis.</p>';
  notes.forEach(n => {
    const d = document.createElement('div'); d.className = 'note';
    d.innerHTML = '<span></span><button>Delete</button>'; d.firstChild.textContent = n.text;
    d.lastChild.onclick = () => { notes = notes.filter(x => x.id !== n.id); persist(); drawNotes(); };
    $('#noteList').appendChild(d);
  });
}
$('#notesBtn').onclick = () => { drawNotes(); $('#dNotes').showModal(); };
$('#closeNotes').onclick = () => $('#dNotes').close();

/* restore chat */
msgs.forEach(m => {
  if (m.role === 'user' && typeof m.content === 'string') bubble('user', m.content);
  if (m.role === 'assistant'){
    const t = m.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
    if (t) bubble('assistant', t);
  }
});
if (!msgs.length) bubble('sys', cfg.key ? 'Tap the mic and talk.' : 'Open Settings and add your Anthropic API key to start.');
setState('idle');
</script>
</body>
</html>
